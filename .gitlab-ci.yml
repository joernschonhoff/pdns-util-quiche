stages:
  - build
  - publish
  - release

# ── build ─────────────────────────────────────────────────────────────────────

.build-template:
  stage: build
  image: docker:29.9.2@sha256:e486f5f730f413505b97a713fbeccb7ab327a3b259474c7c1155e0c3915c27fe
  services:
    - docker:29.9.2-dind@sha256:e486f5f730f413505b97a713fbeccb7ab327a3b259474c7c1155e0c3915c27fe
  rules:
    - changes:
        - Dockerfile
        - VERSION
        - build_quiche.sh
  before_script:
    - |
      if [ -n "$CI_REGISTRY_PASSWORD" ]; then
        docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
      fi
    - docker buildx create --use
  script:
    - |
      docker buildx build \
        --platform "linux/${TARGET_ARCH}" \
        --provenance=false \
        --sbom=false \
        --label org.opencontainers.image.created=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
        --label org.opencontainers.image.revision="${CI_COMMIT_SHA}" \
        --cache-from=type=registry,ref="${CI_REGISTRY_IMAGE}:${TARGET_ARCH}-buildcache" \
        --cache-to=type=registry,ref="${CI_REGISTRY_IMAGE}:${TARGET_ARCH}-buildcache",mode=max \
        --tag "${CI_REGISTRY_IMAGE}:${TARGET_ARCH}-${CI_COMMIT_SHA}" \
        --push \
        .

build:amd64:
  extends: .build-template
  tags:
    - saas-linux-small-amd64
  variables:
    TARGET_ARCH: amd64

build:arm64:
  extends: .build-template
  tags:
    - saas-linux-small-arm64
  variables:
    TARGET_ARCH: arm64

# ── publish ───────────────────────────────────────────────────────────────────

publish:
  stage: publish
  image: docker:29.9.2@sha256:e486f5f730f413505b97a713fbeccb7ab327a3b259474c7c1155e0c3915c27fe
  services:
    - docker:29.9.2-dind@sha256:e486f5f730f413505b97a713fbeccb7ab327a3b259474c7c1155e0c3915c27fe
  rules:
    - if: '$CI_COMMIT_TAG'
      when: always
  needs:
    - job: build:amd64
      optional: true
    - job: build:arm64
      optional: true
  before_script:
    # Check if CI_COMMIT_TAG is equal to the version in the VERSION file to prevent accidental mismatches.
    - |
      TAG_VERSION="${CI_COMMIT_TAG#v}"
      if [ "$TAG_VERSION" != "$(cat VERSION)" ]; then
        echo "Error: CI_COMMIT_TAG ($CI_COMMIT_TAG) does not match VERSION file ($(cat VERSION))"
        exit 1
      fi
    - |
      if [ -n "$CI_REGISTRY_PASSWORD" ]; then
        docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
      fi
  script:
    - export QUICHE_VERSION=$(cat VERSION)
    # Retag and push the built images with the version tag.
    - echo "Retagging images with version ${QUICHE_VERSION}"
    - |
      docker tag "${CI_REGISTRY_IMAGE}:amd64-${CI_COMMIT_SHA}" "${CI_REGISTRY_IMAGE}:${QUICHE_VERSION}-amd64"
      docker tag "${CI_REGISTRY_IMAGE}:arm64-${CI_COMMIT_SHA}" "${CI_REGISTRY_IMAGE}:${QUICHE_VERSION}-arm64"
      docker push "${CI_REGISTRY_IMAGE}:${QUICHE_VERSION}-amd64"
      docker push "${CI_REGISTRY_IMAGE}:${QUICHE_VERSION}-arm64"
    - echo "Creating multi-architecture image for version ${QUICHE_VERSION}"
    - |
      docker buildx imagetools create \
        --provenance=false \
        --sbom=false \
        --tag "${CI_REGISTRY_IMAGE}:${QUICHE_VERSION}" \
        "${CI_REGISTRY_IMAGE}:${QUICHE_VERSION}-amd64" \
        "${CI_REGISTRY_IMAGE}:${QUICHE_VERSION}-arm64"
    # Create/update the latest multi-architecture tag.
    - echo "Creating multi-architecture image for the latest tag"
    - |
      docker buildx imagetools create \
        --provenance=false \
        --sbom=false \
        --tag "${CI_REGISTRY_IMAGE}:latest" \
        "${CI_REGISTRY_IMAGE}:${QUICHE_VERSION}-amd64" \
        "${CI_REGISTRY_IMAGE}:${QUICHE_VERSION}-arm64"
    # Expose QUICHE_VERSION to the release job. GitLab expands the
    # `release:` keyword's variables before the job's script runs, so the
    # version has to arrive via a dotenv artifact rather than `export`.
    - echo "RELEASE_VERSION=${QUICHE_VERSION}" >> release.env
  artifacts:
    reports:
      dotenv: release.env

# ── release ───────────────────────────────────────────────────────────────────

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:v0.24.0@sha256:3f52d526f48e8d10625c722fa6d6423ee82aadeae1b1aa91f07b62551d96dacf
  rules:
    - if: '$CI_COMMIT_TAG'
      when: always
  needs:
    - publish
  script:
    - echo "Creating release $RELEASE_VERSION"
  release:
    tag_name: "$RELEASE_VERSION"
    description: "pdns-util-quiche $RELEASE_VERSION"
