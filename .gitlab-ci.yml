stages:
  - build
  - cleanup
  - publish
  - release

# ── build ─────────────────────────────────────────────────────────────────────

.build-template:
  stage: build
  image: docker:29.8.2@sha256:7dcdfc4a20246236f558175182ccace1eb15a41bd3eb119dd2284f393498b7c1
  services:
    - docker:29.8.2-dind@sha256:7dcdfc4a20246236f558175182ccace1eb15a41bd3eb119dd2284f393498b7c1
  rules:
    - changes:
        - Dockerfile
        - VERSION
        - build_quiche.sh
  before_script:
    - |
      if [ -n "$CI_REGISTRY_PASSWORD" ]; then
        docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
      fi
    - docker buildx create --use
  script:
    - |
      docker buildx build \
        --platform "linux/${TARGET_ARCH}" \
        --label org.opencontainers.image.created=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
        --label org.opencontainers.image.revision="${CI_COMMIT_SHA}" \
        --cache-from=type=registry,ref="${CI_REGISTRY_IMAGE}:${TARGET_ARCH}-buildcache" \
        --cache-to=type=registry,ref="${CI_REGISTRY_IMAGE}:${TARGET_ARCH}-buildcache",mode=max \
        --tag "${CI_REGISTRY_IMAGE}:${TARGET_ARCH}-${CI_COMMIT_SHA}" \
        --push \
        .

build:amd64:
  extends: .build-template
  tags:
    - saas-linux-small-amd64
  variables:
    TARGET_ARCH: amd64

build:arm64:
  extends: .build-template
  tags:
    - saas-linux-small-arm64
  variables:
    TARGET_ARCH: arm64

# ── cleanup ───────────────────────────────────────────────────────────────────
# This removes images from the registry if there is no commit tag
# This should run AFTER build but also if the build fails
delete_image:
  stage: cleanup
  needs:
    - build:amd64
    - build:arm64
  variables:
    REGCTL_VERSION: v0.11.6
  rules:
      - if: '$CI_COMMIT_TAG == null'
        when: always
  image: alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
  script:
    - apk update
    - apk add curl
    - >
      curl
      --fail-with-body
      --location
      "https://github.com/regclient/regclient/releases/download/${REGCTL_VERSION}/regctl-linux-amd64"
       > /usr/bin/regctl
    - chmod 755 /usr/bin/regctl
    - regctl registry login ${CI_REGISTRY} -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD}
    - regctl tag rm "${CI_REGISTRY_IMAGE}:amd64-${CI_COMMIT_SHA}"
    - regctl tag rm "${CI_REGISTRY_IMAGE}:arm64-${CI_COMMIT_SHA}"

# ── publish ───────────────────────────────────────────────────────────────────

publish:
  stage: publish
  image: docker:29.8.2@sha256:7dcdfc4a20246236f558175182ccace1eb15a41bd3eb119dd2284f393498b7c1
  services:
    - docker:29.8.2-dind@sha256:7dcdfc4a20246236f558175182ccace1eb15a41bd3eb119dd2284f393498b7c1
  rules:
    - if: '$CI_COMMIT_TAG'
      when: always
  needs:
    - build:amd64
    - build:arm64
  before_script:
    - |
      if [ -n "$CI_REGISTRY_PASSWORD" ]; then
        docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
      fi
  script:
    - export QUICHE_VERSION=$(cat VERSION)
    - |
      docker buildx imagetools create \
        --tag "${CI_REGISTRY_IMAGE}:${QUICHE_VERSION}" \
        "${CI_REGISTRY_IMAGE}:amd64-${CI_COMMIT_SHA}" \
        "${CI_REGISTRY_IMAGE}:arm64-${CI_COMMIT_SHA}"

    # Create/update the latest multi-architecture tag.
    - |
      docker buildx imagetools create \
        --tag "${CI_REGISTRY_IMAGE}:latest" \
        "${CI_REGISTRY_IMAGE}:amd64-${CI_COMMIT_SHA}" \
        "${CI_REGISTRY_IMAGE}:arm64-${CI_COMMIT_SHA}"

    # Expose QUICHE_VERSION to the release job. GitLab expands the
    # `release:` keyword's variables before the job's script runs, so the
    # version has to arrive via a dotenv artifact rather than `export`.
    - echo "RELEASE_VERSION=${QUICHE_VERSION}" >> release.env
  artifacts:
    reports:
      dotenv: release.env

# ── release ───────────────────────────────────────────────────────────────────

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:v0.24.0@sha256:3f52d526f48e8d10625c722fa6d6423ee82aadeae1b1aa91f07b62551d96dacf
  rules:
    - if: '$CI_COMMIT_TAG'
      when: always
  needs:
    - publish
  script:
    - echo "Creating release $RELEASE_VERSION"
  release:
    tag_name: "$RELEASE_VERSION"
    description: "pdns-util-quiche $RELEASE_VERSION"
